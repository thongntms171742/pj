components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Unauthorized — token missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    StateMachineViolation:
      description: State machine / business rule violation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UpstreamError:
      description: Upstream service error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UpstreamTimeout:
      description: Upstream service timeout
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: string }
        roles:
          type: array
          items: { type: string, enum: [buyer, admin] }
        accountStatus: { type: string, enum: [active, suspended] }
        accountStatusReason: { type: string }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }
        createdAt: { type: string, format: date-time }

    Address:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        province: { type: string }
        district: { type: string }
        ward: { type: string }
        isDefault: { type: boolean }

    AddressInput:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        province: { type: string }
        district: { type: string }
        ward: { type: string }
        isDefault: { type: boolean }

    Tree:
      type: object
      properties:
        _id: { type: string }
        size: { type: string, enum: [S, M, L] }
        name: { type: string }
        heightCmMin: { type: integer }
        heightCmMax: { type: integer }
        diameterCm: { type: integer }
        material: { type: string }
        density: { type: string }
        description: { type: string }
        images:
          type: array
          items: { type: string, format: uri }
        bareImage: { type: string, format: uri }
        price: { type: integer, description: 'VND' }
        stock: { type: integer }
        isActive: { type: boolean }
        sortOrder: { type: integer }

    TreeInput:
      type: object
      required: [size, name, price]
      properties:
        size: { type: string, enum: [S, M, L] }
        name: { type: string }
        price: { type: integer }
        heightCmMin: { type: integer }
        heightCmMax: { type: integer }
        diameterCm: { type: integer }
        material: { type: string }
        density: { type: string }
        description: { type: string }
        images:
          type: array
          items: { type: string }
        bareImage: { type: string }
        stock: { type: integer }
        isActive: { type: boolean }
        sortOrder: { type: integer }

    Style:
      type: object
      properties:
        _id: { type: string }
        code: { type: string, enum: [CLASSIC, MINIMAL, GINGERBREAD, WINTER, CUTE, LUXURY] }
        name: { type: string }
        description: { type: string }
        palette:
          type: array
          items: { type: string, description: 'hex color' }
        coverImage: { type: string, format: uri }
        isActive: { type: boolean }
        sortOrder: { type: integer }

    StyleInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, enum: [CLASSIC, MINIMAL, GINGERBREAD, WINTER, CUTE, LUXURY] }
        name: { type: string }
        description: { type: string }
        palette:
          type: array
          items: { type: string }
        coverImage: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }

    Accessory:
      type: object
      properties:
        _id: { type: string }
        group: { type: string, enum: [LIGHTS, ORNAMENT, DECOR, PERSONAL] }
        type: { type: string }
        name: { type: string }
        description: { type: string }
        image: { type: string, format: uri }
        price: { type: integer, description: 'VND' }
        stock: { type: integer }
        styleCodes:
          type: array
          items: { type: string }
        maxQty:
          oneOf:
            - type: integer
            - type: object
              properties:
                S: { type: integer }
                M: { type: integer }
                L: { type: integer }
          description: 'Number if ?size= is provided, else object {S,M,L}'
        isPersonalizable: { type: boolean }
        personalizationMaxLength: { type: integer }
        productionDays: { type: integer }
        isActive: { type: boolean }
        sortOrder: { type: integer }

    AccessoryInput:
      type: object
      required: [group, type, name, price]
      properties:
        group: { type: string, enum: [LIGHTS, ORNAMENT, DECOR, PERSONAL] }
        type: { type: string }
        name: { type: string }
        description: { type: string }
        image: { type: string }
        price: { type: integer }
        stock: { type: integer }
        styleCodes:
          type: array
          items: { type: string }
        maxQtyBySize:
          type: object
          properties:
            S: { type: integer }
            M: { type: integer }
            L: { type: integer }
        isPersonalizable: { type: boolean }
        personalizationMaxLength: { type: integer }
        productionDays: { type: integer }
        isActive: { type: boolean }
        sortOrder: { type: integer }

    DesignConfig:
      type: object
      required: [treeId, styleId, accessories, deliveryOption]
      properties:
        treeId: { type: string, description: 'Mongo ObjectId of Tree' }
        styleId: { type: string, description: 'Mongo ObjectId of Style' }
        accessories:
          type: array
          items:
            type: object
            required: [accessoryId, quantity]
            properties:
              accessoryId: { type: string, description: 'Mongo ObjectId of Accessory' }
              quantity: { type: integer, minimum: 1 }
              personalizationText: { type: string, description: 'Required if accessory.isPersonalizable. Regex ^[A-Za-z0-9 ]{1,20}$' }
        deliveryOption: { type: string, enum: [READY_TO_DISPLAY, DIY_KIT, SEPARATE] }

    PriceBreakdown:
      type: object
      properties:
        tree:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            size: { type: string, enum: [S, M, L] }
            unitPrice: { type: integer, description: 'VND' }
        style:
          type: object
          properties:
            id: { type: string }
            code: { type: string, enum: [CLASSIC, MINIMAL, GINGERBREAD, WINTER, CUTE, LUXURY] }
            name: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              accessoryId: { type: string }
              name: { type: string }
              type: { type: string }
              group: { type: string, enum: [LIGHTS, ORNAMENT, DECOR, PERSONAL] }
              image: { type: string }
              unitPrice: { type: integer, description: 'VND' }
              quantity: { type: integer }
              lineTotal: { type: integer, description: 'VND' }
              isPersonalizable: { type: boolean }
              personalizationMaxLength: { type: integer }
              productionDays: { type: integer }
        decorationFee: { type: integer, description: 'VND — 0 unless READY_TO_DISPLAY' }
        shippingFee: { type: integer, description: 'VND — 30000' }
        unitTotal: { type: integer, description: 'VND — full price for 1 set' }
        productionDays: { type: integer }
        hasPersonalization: { type: boolean }
        hasService: { type: boolean, description: 'true if decoration fee > 0' }
        warnings:
          type: array
          items: { type: string }

    Design:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        slug: { type: string }
        year: { type: integer }
        config: { $ref: '#/components/schemas/DesignConfig' }
        isPublic: { type: boolean }
        isPreset: { type: boolean }
        duplicatedFrom: { type: string, nullable: true }
        previewImage: { type: string }
        ownerId: { type: string, nullable: true }
        shareUrl: { type: string }
        pricing: { $ref: '#/components/schemas/PriceBreakdown' }

    Cart:
      type: object
      properties:
        _id: { type: string }

    CartItem:
      type: object
      properties:
        _id: { type: string }
        cartId: { type: string }
        designId: { type: string, nullable: true }
        quantity: { type: integer }
        priceSnapshot: { type: integer }
        currentUnitTotal: { type: integer, nullable: true }
        priceChanged: { type: boolean }
        checked: { type: boolean }
        config: { $ref: '#/components/schemas/DesignConfig' }
        design: { $ref: '#/components/schemas/Design' }
        warning: { type: string }

    Order:
      type: object
      properties:
        _id: { type: string }
        orderCode: { type: string, example: "BYC-12345678" }
        buyerId: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              designId: { type: string, nullable: true }
              designName: { type: string }
              previewImage: { type: string }
              tree: { $ref: '#/components/schemas/OrderItemTree' }
              style: { $ref: '#/components/schemas/OrderItemStyle' }
              lines:
                type: array
                items: { $ref: '#/components/schemas/OrderItemLine' }
              deliveryOption: { type: string, enum: [READY_TO_DISPLAY, DIY_KIT, SEPARATE] }
              unitTotal: { type: integer }
              quantity: { type: integer }
              lineTotal: { type: integer }
              hasPersonalization: { type: boolean }
              productionDays: { type: integer }
        subtotal: { type: integer }
