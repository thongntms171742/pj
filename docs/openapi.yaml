openapi: 3.0.3

info:
  title: Build Your Christmas API
  description: |
    REST API for **Build Your Christmas** — single-brand Christmas tree e-commerce platform
    với 3 sizes (S/M/L) × 6 styles × ~25 accessories, Christmas tree editor (live quote),
    HCM-only delivery, design save/share, và admin catalog management.

    Backend is the source of truth for:
    - authentication & user identity (single-brand: chỉ roles `buyer` và `admin`)
    - catalog (Tree, Style, Accessory)
    - tree design editor (TreeDesign with live pricing)
    - shopping cart (DesignConfig-based, không phải product-based)
    - order lifecycle (HCM-only delivery, snapshot design, atomic stock reservation)
    - payment (mock, COD + online)
    - shipment tracking (HCM Delivery in-house)
    - admin management (catalog CRUD + orders + stats + users)
  version: 2.0.0

servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://api.buildyourchristmas.vn
    description: Production (TBD)

tags:
  - name: Health
    description: System health check
  - name: Auth
    description: Authentication, registration, profile
  - name: Users
    description: User saved addresses
  - name: Addresses
    description: CAS Address Kit proxy (provinces/communes, HCM focus)
  - name: Catalog
    description: Public catalog — trees, styles, accessories, presets, delivery options, live quote
  - name: Designs
    description: TreeDesign CRUD — save, share, duplicate, public quote
  - name: Cart
    description: DesignConfig-based cart
  - name: Orders
    description: HCM-only order creation + state machine + shipment
  - name: Payments
    description: Mock online payment checkout
  - name: Notifications
    description: User notification feed
  - name: Admin
    description: Christmas catalog CRUD + order overview + stats + user management

paths:

  # ============================================================
  # HEALTH
  # ============================================================
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }

  # ============================================================
  # AUTH
  # ============================================================
  /api/auth/register:
    post:
      tags: [Auth]
      summary: "Register a new user (role: buyer)"
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Account suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/auth/me/avatar:
    put:
      tags: [Auth]
      summary: Update user avatar
      operationId: updateAvatar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatarUrl]
              properties:
                avatarUrl: { type: string, format: uri }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================================================
  # USERS (saved addresses)
  # ============================================================
  /api/users/me/addresses:
    get:
      tags: [Users]
      summary: List user's saved addresses
      operationId: getAddresses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Add a new address
      operationId: addAddress
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/me/addresses/{id}:
    patch:
      tags: [Users]
      summary: Update an address
      operationId: updateAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  address: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Delete an address
      operationId: deleteAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # ADDRESSES (CAS proxy)
  # ============================================================
  /api/addresses/provinces:
    get:
      tags: [Addresses]
      summary: List provinces/cities
      operationId: getProvinces
      parameters:
        - in: query
          name: effectiveDate
          schema:
            type: string
            default: latest
          description: '"latest" or YYYY-MM-DD'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "79" }
                        name: { type: string, example: "Thành phố Hồ Chí Minh" }
                  effectiveDate: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }

  /api/addresses/provinces/{provinceId}/communes:
    get:
      tags: [Addresses]
      summary: List communes by province
      operationId: getCommunesByProvince
      parameters:
        - in: path
          name: provinceId
          required: true
          schema: { type: string }
        - in: query
          name: effectiveDate
          schema: { type: string, default: latest }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                  effectiveDate: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }

  /api/addresses/communes:
    get:
      tags: [Addresses]
      summary: List all communes nationwide
      operationId: getAllCommunes
      parameters:
        - in: query
          name: effectiveDate
          schema: { type: string, default: latest }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        provinceId: { type: string }
                  effectiveDate: { type: string }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }

  # ============================================================
  # CATALOG (public)
  # ============================================================
  /api/catalog/trees:
    get:
      tags: [Catalog]
      summary: List 3 tree SKUs (S/M/L)
      operationId: getTrees
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trees:
                    type: array
                    items: { $ref: '#/components/schemas/Tree' }

  /api/catalog/styles:
    get:
      tags: [Catalog]
      summary: List 6 style concepts
      operationId: getStyles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  styles:
                    type: array
                    items: { $ref: '#/components/schemas/Style' }

  /api/catalog/accessories:
    get:
      tags: [Catalog]
      summary: List accessories (filter by type/group/style/size)
      operationId: getAccessories
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [LIGHT_STRING, CANDLE, BAUBLE, BELL, CANDY, FIGURINE, BOW, STAR, STOCKING, NAME_TAG, NAME_ORNAMENT] }
        - in: query
          name: group
          schema: { type: string, enum: [LIGHTS, ORNAMENT, DECOR, PERSONAL] }
        - in: query
          name: style
          schema: { type: string, description: 'Style code (vd CLASSIC)' }
        - in: query
          name: size
          schema: { type: string, enum: [S, M, L], description: 'If provided, maxQty returns as number for that size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessories:
                    type: array
                    items: { $ref: '#/components/schemas/Accessory' }

  /api/catalog/presets:
    get:
      tags: [Catalog]
      summary: List ready-made (admin) presets, hydrated with pricing
      operationId: getPresets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { $ref: '#/components/schemas/Design' }

  /api/catalog/delivery-options:
    get:
      tags: [Catalog]
      summary: List delivery options + decoration fee per size
      operationId: getDeliveryOptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryOption' }

  /api/catalog/quote:
    post:
      tags: [Catalog]
      summary: Live price preview from DesignConfig (no auth)
      operationId: quoteDesign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { $ref: '#/components/schemas/DesignConfig' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricing: { $ref: '#/components/schemas/PriceBreakdown' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # DESIGNS
  # ============================================================
  /api/designs/quote:
    post:
      tags: [Designs]
      summary: Same as catalog/quote (alias for editor UX)
      operationId: quoteDesignDesigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { $ref: '#/components/schemas/DesignConfig' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricing: { $ref: '#/components/schemas/PriceBreakdown' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/designs:
    post:
      tags: [Designs]
      summary: Save a TreeDesign for the authenticated user
      operationId: createDesign
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name: { type: string }
                config: { $ref: '#/components/schemas/DesignConfig' }
                previewImage: { type: string }
                isPublic: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  design: { $ref: '#/components/schemas/Design' }
                  shareUrl: { type: string, example: "/tree/my-design" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Designs]
      summary: List my designs
      operationId: getMyDesigns
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  designs:
                    type: array
                    items: { $ref: '#/components/schemas/Design' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/designs/mine:
    get:
      tags: [Designs]
      summary: List my designs (same as GET /api/designs but explicit)
      operationId: getMyDesignsExplicit
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  designs:
                    type: array
                    items: { $ref: '#/components/schemas/Design' }
                  total: { type: integer }

  /api/designs/share/{slug}:
    get:
      tags: [Designs]
      summary: Get a design by share slug (public if isPublic, else owner/admin)
      operationId: getSharedDesign
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  design: { $ref: '#/components/schemas/Design' }
        '403':
          description: Design is private and not owned by caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/designs/{id}:
    get:
      tags: [Designs]
      summary: Get a design by Mongo _id (owner/admin only)
      operationId: getDesignById
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  design: { $ref: '#/components/schemas/Design' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Designs]
      summary: Update a design (owner only)
      operationId: updateDesign
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                config: { $ref: '#/components/schemas/DesignConfig' }
                previewImage: { type: string }
                isPublic: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  design: { $ref: '#/components/schemas/Design' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Designs]
      summary: Delete a design (owner only — preset cannot be deleted)
      operationId: deleteDesign
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/designs/{id}/duplicate:
    post:
      tags: [Designs]
      summary: Duplicate a design (own / public / preset)
      operationId: duplicateDesign
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  design: { $ref: '#/components/schemas/Design' }
                  shareUrl: { type: string }

  # ============================================================
  # CART
  # ============================================================
  /api/cart:
    get:
      tags: [Cart]
      summary: Get user's cart
      operationId: getCart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart: { $ref: '#/components/schemas/Cart' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CartItem' }
    delete:
      tags: [Cart]
      summary: Clear cart (alias of /api/cart/clear)
      operationId: clearCartAlias
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add a design to cart
      operationId: addCartItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config: { $ref: '#/components/schemas/DesignConfig' }
                designId: { type: string, description: 'Alternative to config' }
                quantity: { type: integer, minimum: 1, default: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/CartItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update cart item (quantity / checked / config)
      operationId: updateCartItem
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 1 }
                checked: { type: boolean }
                config: { $ref: '#/components/schemas/DesignConfig' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/CartItem' }
    delete:
      tags: [Cart]
      summary: Remove a cart item
      operationId: deleteCartItem
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }

  /api/cart/clear:
    delete:
      tags: [Cart]
      summary: Clear all cart items
      operationId: clearCart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  # ============================================================
  # ORDERS
  # ============================================================
  /api/orders:
    get:
      tags: [Orders]
      summary: "List my orders (admin: all)"
      operationId: getMyOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, description: 'OrderStatus enum' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
    post:
      tags: [Orders]
      summary: Create an order (HCM only, designConfirmed required)
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingProvinceId, designConfirmed]
              properties:
                shippingName: { type: string }
                shippingPhone: { type: string }
                shippingAddress: { type: string }
                shippingProvinceId: { type: string, description: 'HARD-CODED "79" for HCM', example: "79" }
                shippingProvinceName: { type: string }
                shippingCommuneId: { type: string }
                shippingCommuneName: { type: string }
                addressEffectiveDate: { type: string }
                paymentMethod: { type: string, enum: [COD, ONLINE], default: COD }
                idempotencyKey: { type: string }
                designConfirmed: { type: boolean, description: 'REQUIRED — must be true' }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      config: { $ref: '#/components/schemas/DesignConfig' }
                      designId: { type: string }
                      quantity: { type: integer, default: 1 }
                cartItemIds:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: HCM-only — DELIVERY_AREA_NOT_SUPPORTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by _id or orderCode
      operationId: getOrderById
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, description: 'Mongo _id or orderCode (BYC-########)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Orders]
      summary: Update order status (state machine)
      operationId: updateOrderStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
